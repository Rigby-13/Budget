<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover — растягиваем приложение под чёлку и полоску снизу -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Бюджет</title>

  <!-- Настройки для "Добавить на экран Домой" в Safari -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Бюджет">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===================== ВКЛАДКА «ТРАТЫ» ===================== -->
  <main id="view-expenses" class="view active">
    <header class="topbar">
      <button class="icon-btn" id="prev-month" aria-label="Предыдущий месяц">‹</button>
      <h1 id="month-title">Месяц</h1>
      <button class="icon-btn" id="next-month" aria-label="Следующий месяц">›</button>
    </header>

    <section class="summary card">
      <div class="summary-label">Расходы за месяц</div>
      <div class="summary-main" id="sum-expense">0 ₽</div>
      <div class="summary-row">
        <div><span class="muted">Доходы</span><b id="sum-income" class="income">0 ₽</b></div>
        <div><span class="muted">Баланс</span><b id="sum-balance">0 ₽</b></div>
      </div>
    </section>

    <div id="tx-list"></div>
  </main>

  <!-- ===== Остальные вкладки — появятся на следующих этапах ===== -->
  <main id="view-stats" class="view">
    <header class="topbar"><h1>Статистика</h1></header>
    <div class="empty">Скоро здесь будет статистика 📊</div>
  </main>
  <main id="view-debts" class="view">
    <header class="topbar"><h1>Долги</h1></header>
    <div class="empty">Скоро здесь будут долги 🤝</div>
  </main>
  <main id="view-wishlist" class="view">
    <header class="topbar"><h1>Корзина</h1></header>
    <div class="empty">Скоро здесь будет вишлист 🛍️</div>
  </main>

  <!-- Большая кнопка «+» -->
  <button id="fab" aria-label="Добавить запись">+</button>

  <!-- ===================== НИЖНЯЯ ПАНЕЛЬ ВКЛАДОК ===================== -->
  <nav class="tabbar">
    <button class="tab active" data-view="expenses">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span>Траты</span>
    </button>
    <button class="tab" data-view="stats">
      <svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>
      <span>Статистика</span>
    </button>
    <button class="tab" data-view="debts">
      <svg viewBox="0 0 24 24"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg>
      <span>Долги</span>
    </button>
    <button class="tab" data-view="wishlist">
      <svg viewBox="0 0 24 24"><path d="M3 4h2l2.5 11h10L20 8H6.5"/><circle cx="9" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/></svg>
      <span>Корзина</span>
    </button>
  </nav>

  <!-- ============ ВЫЕЗЖАЮЩАЯ ПАНЕЛЬ: ДОБАВИТЬ / ИЗМЕНИТЬ ЗАПИСЬ ============ -->
  <div id="backdrop" class="backdrop"></div>
  <form id="tx-sheet" class="sheet" autocomplete="off" novalidate>
    <div class="sheet-header">
      <button type="button" class="link-btn" id="tx-cancel">Отмена</button>
      <div class="segmented" id="tx-type">
        <button type="button" data-type="expense" class="active">Расход</button>
        <button type="button" data-type="income">Доход</button>
      </div>
      <button type="submit" class="link-btn bold">Готово</button>
    </div>

    <div class="sheet-body">
      <label class="amount-wrap">
        <input id="tx-amount" type="text" inputmode="decimal" placeholder="0" aria-label="Сумма">
        <span class="currency">₽</span>
      </label>

      <div class="cat-grid" id="tx-categories"></div>

      <div class="field-row">
        <label class="field">
          <span>Дата</span>
          <input id="tx-date" type="date">
        </label>
      </div>
      <label class="field">
        <span>Комментарий</span>
        <input id="tx-comment" type="text" placeholder="необязательно" enterkeyhint="done">
      </label>

      <button type="button" class="danger-btn" id="tx-delete" hidden>Удалить запись</button>
    </div>
  </form>

  <div id="toast" class="toast" role="status"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
